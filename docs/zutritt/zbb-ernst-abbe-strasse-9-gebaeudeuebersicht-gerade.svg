<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.34"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <filter id="markerShadow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="35" y="35" width="1530" height="830" rx="26" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
  <rect x="70" y="60" width="1460" height="600" rx="18" fill="#f8fafc"/>
  <rect x="70" y="60" width="1460" height="600" rx="18" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <polygon
      points="1405,611 1247,612 1247,281 1165,281 1027,281 1027,608 738,608 738,294 668,294 668,607 351,608 351,296 271,297 271,607 100,606 100,90 1500,90 1500,282 1405,281"
      fill="#eef1f5"
      stroke="#f27a00"
      stroke-width="7"
      stroke-linejoin="round"
    />
  </g>

  <g transform="translate(1165 281)" filter="url(#markerShadow)">
    <circle r="17" fill="#f27a00" stroke="#ffffff" stroke-width="5"/>
    <circle r="5" fill="#ffffff"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="1188" y="270" fill="#a24d00" font-size="18" font-weight="700">Kundeneingang</text>

    <text x="100" y="708" fill="#111827" font-size="32" font-weight="750">ZBB · Gebäude Nr. 9</text>
    <text x="100" y="744" fill="#64748b" font-size="21">Gerade ausgerichtete 2D-Arbeitsfläche · Außenkontur · 2 Etagen</text>

    <g transform="translate(100 792)">
      <rect width="244" height="10" fill="#1f2937"/>
      <rect width="122" height="10" fill="#f27a00"/>
      <line x1="0" y1="-7" x2="0" y2="18" stroke="#1f2937" stroke-width="3"/>
      <line x1="244" y1="-7" x2="244" y2="18" stroke="#1f2937" stroke-width="3"/>
      <text x="122" y="39" text-anchor="middle" fill="#64748b" font-size="17">ca. 20 m</text>
    </g>

    <g transform="translate(1460 760)">
      <circle r="45" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <g transform="rotate(25.6)">
        <path d="M 0 -31 L -11 9 L 0 3 L 11 9 Z" fill="#1f2937"/>
      </g>
      <text y="31" text-anchor="middle" fill="#1f2937" font-size="17" font-weight="700">N</text>
    </g>

    <text x="420" y="798" fill="#64748b" font-size="17">Freie Fläche für Raum- und Türmarkierungen</text>
    <text x="420" y="828" fill="#94a3b8" font-size="15">Außenkontur nach OpenStreetMap, Objekt 112468936 · Geometrie gedreht, Form unverändert · © OpenStreetMap-Mitwirkende, ODbL</text>
  </g>
</svg>
